[project]
site_name = "Sistemas Multiagentes / Agentic AI"

nav = [
  { "Início" = "index.md" },
  { "Plano de Ensino" = "plano-de-ensino.md" },
  { "Cronograma" = "cronograma.md" },
  { "Encontros" = [
    { "Encontros" = "encontros/index.md" },
    { "01 — O que é um agente?" = "encontros/encontro-01-o-que-e-um-agente.md" },
    { "02 — Quando tornar um sistema agentivo?" = "encontros/encontro-02-quando-vale-a-pena-tornar-um-sistema-agentivo.md" },
    { "03 — Do que é feito um agente baseado em LLM?" = "encontros/encontro-03-do-que-e-feito-um-agente-baseado-em-llm.md" },
    { "04 — Como um agente passa de responder para agir?" = "encontros/encontro-04-como-um-agente-passa-de-responder-para-agir.md" },
    { "05 — O que o agente precisa saber agora?" = "encontros/encontro-05-o-que-o-agente-precisa-saber-agora.md" },
  ] },
  { "Desafios" = "desafios/index.md" },
  { "Projeto" = "projeto/index.md" },
  { "Materiais" = [
    { "Materiais" = "materiais/index.md" },
    { "Ambiente de desenvolvimento" = "materiais/ambiente.md" },
    { "Referências" = "materiais/referencias.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "pt-BR"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Usar tema claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Usar tema escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Usar preferência do sistema"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
pymdownx.arithmatex = { generic = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}
