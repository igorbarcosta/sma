name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run python scripts/check_env.py
      - run: npm ci
      - name: Validate and build
        run: npm run validate
      - name: Add rendered slides to the site
        run: |
          shopt -s nullglob
          rendered=(slides/rendered/*.html slides/rendered/*.pdf)
          if (( ${#rendered[@]} )); then
            mkdir -p site/slides/rendered
            cp "${rendered[@]}" site/slides/rendered/
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
